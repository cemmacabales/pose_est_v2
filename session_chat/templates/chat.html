<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coach Chat — Workout Session</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg-primary: #0f0f1a;
    --bg-secondary: #1a1a2e;
    --bg-card: #16213e;
    --bg-input: #1e1e3f;
    --border-color: #2a2a4e;
    --text-primary: #e8e8f0;
    --text-secondary: #a0a0b8;
    --text-muted: #6e6e8a;
    --accent: #4f46e5;
    --accent-hover: #6366f1;
    --user-bubble: #4f46e5;
    --assistant-bubble: #252545;
    --score-green: #22c55e;
    --score-yellow: #f59e0b;
    --score-red: #ef4444;
    --shadow: 0 4px 20px rgba(0,0,0,0.3);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 800px;
    margin: 0 auto;
    background: var(--bg-secondary);
    box-shadow: var(--shadow);
  }

  @media (min-width: 801px) {
    .container {
      height: 95vh;
      margin-top: 2.5vh;
      border-radius: 16px;
      overflow: hidden;
    }
  }

  /* Header */
  .header {
    flex-shrink: 0;
    padding: 12px 16px;
    background: linear-gradient(135deg, var(--bg-card) 0%, #1e2a4a 100%);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .header-info {
    flex: 1;
    min-width: 0;
  }

  .header-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-status {
    font-size: 12px;
    color: var(--score-green);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .header-status::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--score-green);
    border-radius: 50%;
    display: inline-block;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* Summary card */
  .summary-card {
    flex-shrink: 0;
    margin: 12px 16px 0;
    padding: 14px 16px;
    background: linear-gradient(135deg, rgba(79, 70, 229, 0.15), rgba(124, 58, 237, 0.1));
    border: 1px solid rgba(79, 70, 229, 0.2);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    backdrop-filter: blur(10px);
  }

  .summary-info {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .summary-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .summary-date {
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .summary-duration {
    font-size: 12px;
    color: var(--text-muted);
  }

  .score-section {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }

  .score-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
  }

  .score-badge {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    box-shadow: var(--shadow-sm);
    min-width: 56px;
    text-align: center;
  }

  .score-green { background: linear-gradient(135deg, #22c55e, #16a34a); }
  .score-yellow { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .score-red { background: linear-gradient(135deg, #ef4444, #dc2626); }

  /* Date separator */
  .date-separator {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0 8px;
    padding: 0 16px;
  }

  .date-separator::before,
  .date-separator::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-color);
  }

  .date-separator span {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* Chat window */
  .chat-window {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scroll-behavior: smooth;
  }

  .chat-window::-webkit-scrollbar {
    width: 4px;
  }

  .chat-window::-webkit-scrollbar-track {
    background: transparent;
  }

  .chat-window::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 4px;
  }

  /* Message row */
  .message-row {
    display: flex;
    width: 100%;
    padding: 4px 0;
    animation: messageAppear 0.3s ease-out;
  }

  @keyframes messageAppear {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .message-row.user {
    justify-content: flex-end;
  }

  .message-row.assistant {
    justify-content: flex-start;
  }

  .message-wrapper {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 85%;
  }

  .message-row.user .message-wrapper {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
    margin-bottom: 4px;
  }

  .avatar.user {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
  }

  .avatar.assistant {
    background: linear-gradient(135deg, #10b981, #059669);
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.5;
    word-wrap: break-word;
    white-space: pre-wrap;
    position: relative;
    box-shadow: var(--shadow-sm);
  }

  .bubble.user {
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .bubble.assistant {
    background: var(--assistant-bubble);
    color: var(--text-primary);
    border-bottom-left-radius: 4px;
    border: 1px solid var(--border-color);
  }

  .message-time {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 2px;
    padding: 0 4px;
    text-align: right;
  }

  .message-row.user .message-time {
    text-align: left;
  }

  /* Typing indicator */
  .typing-row {
    justify-content: flex-start;
  }

  .typing-wrapper {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }

  .typing-bubble {
    background: var(--assistant-bubble);
    border: 1px solid var(--border-color);
    padding: 14px 18px;
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 60px;
    box-shadow: var(--shadow-sm);
  }

  .typing-dot {
    width: 7px;
    height: 7px;
    background: #888;
    border-radius: 50%;
    animation: typingBounce 1.4s infinite ease-in-out both;
  }

  .typing-dot:nth-child(1) { animation-delay: 0s; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Input bar */
  .input-bar {
    flex-shrink: 0;
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: var(--bg-card);
    border-top: 1px solid var(--border-color);
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .chat-input {
    flex: 1;
    padding: 12px 18px;
    border: 1px solid var(--border-color);
    border-radius: 24px;
    background: var(--bg-input);
    color: var(--text-primary);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    min-height: 44px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .chat-input::placeholder {
    color: var(--text-muted);
  }

  .chat-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }

  .chat-input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .send-btn {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
    box-shadow: 0 2px 8px rgba(79, 70, 229, 0.4);
  }

  .send-btn:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.5);
  }

  .send-btn:active:not(:disabled) {
    transform: scale(0.95);
  }

  .send-btn:disabled {
    opacity: 0.4;
    cursor: default;
    transform: none;
    box-shadow: none;
  }

  .send-btn svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  /* Welcome hint */
  .welcome-hint {
    text-align: center;
    padding: 20px 16px;
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.6;
  }

  .welcome-hint strong {
    color: var(--text-secondary);
    display: block;
    margin-bottom: 4px;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-avatar">&#128170;</div>
    <div class="header-info">
      <div class="header-title">Fitness Coach</div>
      <div class="header-status">Online</div>
    </div>
  </div>

  <!-- Session Summary -->
  <div class="summary-card">
    <div class="summary-info">
      <div class="summary-label">Workout Session</div>
      <div class="summary-date">{{ session_date }}</div>
      <div class="summary-duration">{{ session_duration }}</div>
    </div>
    <div class="score-section">
      <div class="score-label">Form Score</div>
      <div class="score-badge" id="scoreBadge">{{ overall_score }}%</div>
    </div>
  </div>

  <!-- Chat window -->
  <div class="chat-window" id="chatWindow">
    <div class="date-separator"><span>Today</span></div>
  </div>

  <!-- Input bar -->
  <div class="input-bar">
    <input type="text" class="chat-input" id="chatInput" placeholder="Ask about your workout..." autocomplete="off">
    <button class="send-btn" id="sendBtn" aria-label="Send message">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
(function() {
  const chatWindow = document.getElementById('chatWindow');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const scoreBadge = document.getElementById('scoreBadge');

  // Colour the score badge
  const scoreText = scoreBadge.textContent.replace('%', '').trim();
  const score = parseFloat(scoreText);
  if (!isNaN(score)) {
    scoreBadge.classList.remove('score-green', 'score-yellow', 'score-red');
    if (score >= 80) {
      scoreBadge.classList.add('score-green');
    } else if (score >= 60) {
      scoreBadge.classList.add('score-yellow');
    } else {
      scoreBadge.classList.add('score-red');
    }
  }

  function formatTime() {
    const now = new Date();
    return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function appendMessage(text, sender) {
    const row = document.createElement('div');
    row.className = 'message-row ' + sender;

    const wrapper = document.createElement('div');
    wrapper.className = 'message-wrapper';

    const avatar = document.createElement('div');
    avatar.className = 'avatar ' + sender;
    avatar.textContent = sender === 'user' ? '&#128100;' : '&#129302;';

    const contentWrapper = document.createElement('div');
    contentWrapper.style.display = 'flex';
    contentWrapper.style.flexDirection = 'column';
    contentWrapper.style.maxWidth = '100%';

    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + sender;
    bubble.textContent = text;

    const time = document.createElement('div');
    time.className = 'message-time';
    time.textContent = formatTime();

    contentWrapper.appendChild(bubble);
    contentWrapper.appendChild(time);

    wrapper.appendChild(avatar);
    wrapper.appendChild(contentWrapper);
    row.appendChild(wrapper);

    chatWindow.appendChild(row);
    scrollToBottom();
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'message-row assistant typing-row';
    row.id = 'typingIndicator';

    const wrapper = document.createElement('div');
    wrapper.className = 'typing-wrapper';

    const avatar = document.createElement('div');
    avatar.className = 'avatar assistant';
    avatar.textContent = '&#129302;';

    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    for (let i = 0; i < 3; i++) {
      const dot = document.createElement('span');
      dot.className = 'typing-dot';
      bubble.appendChild(dot);
    }

    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);
    row.appendChild(wrapper);
    chatWindow.appendChild(row);
    scrollToBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function scrollToBottom() {
    chatWindow.scrollTo({
      top: chatWindow.scrollHeight,
      behavior: 'smooth'
    });
  }

  function setInputDisabled(disabled) {
    chatInput.disabled = disabled;
    sendBtn.disabled = disabled;
  }

  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    appendMessage(text, 'user');
    chatInput.value = '';
    setInputDisabled(true);
    showTyping();

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await response.json();
      hideTyping();
      if (data && typeof data.reply === 'string') {
        appendMessage(data.reply, 'assistant');
      } else {
        appendMessage('Sorry, something went wrong on my end.', 'assistant');
      }
    } catch (err) {
      hideTyping();
      appendMessage('Sorry, I\'m having trouble connecting. Please check your internet and try again.', 'assistant');
    } finally {
      setInputDisabled(false);
      chatInput.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  // Initial assistant message
  setTimeout(() => {
    appendMessage("Hi! I'm your fitness coach. I can talk about your session, exercise form, training tips, and motivation — but I only know what's in your workout data and our manuals. Ask away!", 'assistant');
  }, 300);
})();
</script>
</body>
</html>
