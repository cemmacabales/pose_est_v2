<!--
MANUAL TEST CHECKLIST
Run: python -c "from session_chat.app import start_server; ..."
Or just: python gui.py → click End Session → scan QR or open http://localhost:5000

Layout:
[ ] Page loads with no console errors (open browser DevTools → Console)
[ ] Session summary card shows correct date, duration, and score
[ ] Score badge is GREEN when overall_score >= 80
[ ] Score badge is YELLOW when overall_score >= 60 and < 80
[ ] Score badge is RED when overall_score < 60
    (test these by temporarily editing the score value in app.py)
[ ] Page looks correct on mobile (DevTools → Toggle device toolbar → 375px width)
[ ] Page looks correct on desktop browser

Chat behaviour:
[ ] Greeting message appears on load without any user action
[ ] Typing a message and pressing Enter submits it
[ ] Typing a message and clicking Send submits it
[ ] Input does not submit when empty or whitespace-only
[ ] Typing indicator (· · ·) appears while waiting for reply
[ ] Input and Send button are disabled while waiting
[ ] Input and Send button re-enable after reply arrives
[ ] User messages appear right-aligned in a blue bubble
[ ] Assistant messages appear left-aligned in a dark grey bubble
[ ] Chat window auto-scrolls to the latest message
[ ] Works after multiple back-and-forth messages (no state corruption)
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Session Chat</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    font-family: system-ui, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    overflow: hidden;
  }

  .container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  /* Top summary card */
  .summary-card {
    flex-shrink: 0;
    padding: 16px;
    background: #16213e;
    border-bottom: 1px solid #2a2a3e;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .summary-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .summary-date {
    font-size: 14px;
    color: #b0b0b0;
  }

  .summary-duration {
    font-size: 13px;
    color: #888;
  }

  .score-badge {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
  }

  .score-green { background: #4caf50; }
  .score-yellow { background: #ff9800; }
  .score-red { background: #f44336; }

  /* Chat window */
  .chat-window {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .message-row {
    display: flex;
    width: 100%;
  }

  .message-row.user {
    justify-content: flex-end;
  }

  .message-row.assistant {
    justify-content: flex-start;
  }

  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.45;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .bubble.user {
    background: #0066cc;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .bubble.assistant {
    background: #2a2a3e;
    color: #e0e0e0;
    border-bottom-left-radius: 4px;
  }

  /* Typing indicator */
  .typing-row {
    justify-content: flex-start;
  }

  .typing-bubble {
    background: #2a2a3e;
    padding: 12px 18px;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .typing-dot {
    width: 7px;
    height: 7px;
    background: #888;
    border-radius: 50%;
    animation: typingBounce 1.4s infinite ease-in-out both;
  }

  .typing-dot:nth-child(1) { animation-delay: 0s; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Input bar */
  .input-bar {
    flex-shrink: 0;
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: #16213e;
    border-top: 1px solid #2a2a3e;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .chat-input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #2a2a3e;
    border-radius: 20px;
    background: #1a1a2e;
    color: #e0e0e0;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    min-height: 40px;
  }

  .chat-input::placeholder {
    color: #666;
  }

  .chat-input:disabled {
    opacity: 0.5;
  }

  .send-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    background: #0066cc;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s;
  }

  .send-btn:hover:not(:disabled) {
    opacity: 0.85;
  }

  .send-btn:active:not(:disabled) {
    opacity: 0.7;
  }

  .send-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }
</style>
</head>
<body>
<div class="container">
  <div class="summary-card">
    <div class="summary-info">
      <div class="summary-date">{{ session_date }}</div>
      <div class="summary-duration">{{ session_duration }}</div>
    </div>
    <div class="score-badge" id="scoreBadge">{{ overall_score }}</div>
  </div>

  <div class="chat-window" id="chatWindow"></div>

  <div class="input-bar">
    <input type="text" class="chat-input" id="chatInput" placeholder="Type a message…" autocomplete="off">
    <button class="send-btn" id="sendBtn">Send</button>
  </div>
</div>

<script>
(function() {
  const chatWindow = document.getElementById('chatWindow');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const scoreBadge = document.getElementById('scoreBadge');

  // Colour the score badge
  const score = parseFloat(scoreBadge.textContent);
  if (!isNaN(score)) {
    scoreBadge.classList.remove('score-green', 'score-yellow', 'score-red');
    if (score >= 80) {
      scoreBadge.classList.add('score-green');
    } else if (score >= 60) {
      scoreBadge.classList.add('score-yellow');
    } else {
      scoreBadge.classList.add('score-red');
    }
  }

  function appendMessage(text, sender) {
    const row = document.createElement('div');
    row.className = 'message-row ' + sender;
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + sender;
    bubble.textContent = text;
    row.appendChild(bubble);
    chatWindow.appendChild(row);
    scrollToBottom();
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'message-row assistant typing-row';
    row.id = 'typingIndicator';
    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    for (let i = 0; i < 3; i++) {
      const dot = document.createElement('span');
      dot.className = 'typing-dot';
      bubble.appendChild(dot);
    }
    row.appendChild(bubble);
    chatWindow.appendChild(row);
    scrollToBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function scrollToBottom() {
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function setInputDisabled(disabled) {
    chatInput.disabled = disabled;
    sendBtn.disabled = disabled;
  }

  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    appendMessage(text, 'user');
    chatInput.value = '';
    setInputDisabled(true);
    showTyping();

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await response.json();
      hideTyping();
      if (data && typeof data.reply === 'string') {
        appendMessage(data.reply, 'assistant');
      } else {
        appendMessage('Sorry, something went wrong.', 'assistant');
      }
    } catch (err) {
      hideTyping();
      appendMessage('Sorry, something went wrong.', 'assistant');
    } finally {
      setInputDisabled(false);
      chatInput.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  // Initial assistant message
  appendMessage("Hi! I'm your fitness coach. I can talk about your session, exercise form, training tips, and motivation — but I only know what's in your workout data and our manuals. Ask away!", 'assistant');
})();
</script>
</body>
</html>
