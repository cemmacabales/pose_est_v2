<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pose Estimation Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      color: #fff;
      font-family: Helvetica, Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #video-wrap {
      position: relative;
      flex: 1;
      background: #000;
    }
    video { display: none; }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    #sidebar {
      width: 340px;
      background: #212121;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }
    .lbl {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .val { font-size: 22px; font-weight: bold; }
    #quality-badge {
      font-size: 16px;
      font-weight: bold;
      padding: 8px 16px;
      display: inline-block;
      background: #333;
      color: #888;
    }
    #quality-badge.correct { background: #1B5E20; color: #69F0AE; }
    #quality-badge.incorrect { background: #B71C1C; color: #FF8A80; }
    #conf-track { background: #333; height: 24px; margin-top: 4px; }
    #conf-fill { height: 24px; width: 0%; }
    #conf-pct { font-size: 13px; color: #ccc; margin-top: 2px; }
    #keypoints-val { font-size: 14px; }
    #status {
      font-size: 13px;
      color: #FF6E40;
      margin-top: auto;
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div id="video-wrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="sidebar">
    <div>
      <div class="lbl">Exercise</div>
      <div class="val" id="exercise-val">Detecting...</div>
    </div>
    <div>
      <div class="lbl">Quality</div>
      <div id="quality-badge">WAITING</div>
    </div>
    <div>
      <div class="lbl">Reps</div>
      <div class="val" id="reps-val">—</div>
    </div>
    <div>
      <div class="lbl">Confidence</div>
      <div id="conf-track"><div id="conf-fill"></div></div>
      <div id="conf-pct">0%</div>
    </div>
    <div>
      <div class="lbl">Keypoints</div>
      <div id="keypoints-val">0 / 33 detected</div>
    </div>
    <div id="status">Loading models…</div>
  </div>

  <!-- TF.js must load before tfjs-tflite -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.10/dist/tf-tflite.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
